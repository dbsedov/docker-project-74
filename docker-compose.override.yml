services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["make", "dev"]
    volumes:
      - ./app:/app
    user: "1000:1000"

  caddy:
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy:/etc/caddy
    depends_on:
      - app
